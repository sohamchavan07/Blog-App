default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: postgres
  password:

development:
  <<: *default
  database: blog_app_development

test:
  <<: *default
  database: blog_app_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] || ENV["PROD_DATABASE_URL"] %>
  # If using explicit production credentials instead of DATABASE_URL, uncomment and set the values below:
  # host: <%= ENV["DB_HOST"] %>
  # username: <%= ENV["DB_USERNAME"] %>
  # password: <%= ENV["DB_PASSWORD"] %>
  # database: <%= ENV["DB_NAME"] %>
  # sslmode: <%= ENV["DB_SSLMODE"] || "require" %>
